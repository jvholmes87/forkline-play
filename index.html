<!doctype html><html><head><meta name="robots" content="noindex, nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forkline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen phone app. Each menu is its own full-height screen (header / scrolling body / action footer); trade, move, route and hazards open as bottom sheets. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --void:#0a1322; --deep:#070d18; --panel:#101c30; --panel2:#16253e; --line:#25385a;
  --ink:#ece6d8; --muted:#95a2b6; --amber:#f2a93b; --amber-ink:#1d1405;
  --ice:#86c9ea; --good:#6cc790; --bad:#f2705f; --sheet:#2a1410;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--deep);color:var(--ink)}
body{margin:0;font:15px/1.45 var(--f-body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--ice)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} p{margin:0}
.up{color:var(--good)} .dn{color:var(--bad)} .warn{color:var(--amber)}
.eyebrow{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}

#app{height:100%;max-width:560px;margin:0 auto;background:var(--void);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h2{font-size:22px;flex:1}
.menubtn{border:1px solid var(--line);border-radius:6px;font-size:20px;margin-left:0;margin-right:4px}
.back{appearance:none;border:0;background:none;width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;cursor:pointer;border-radius:50%;font-size:24px;line-height:1}
.back:hover{background:var(--panel2)}
.body{overflow-y:auto;overscroll-behavior:contain;padding-block:14px 18px;display:grid;gap:14px;align-content:start}
.foot{border-top:1px solid var(--line);background:var(--panel);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}

.btn{font:800 16px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;border:1px solid var(--amber);background:var(--amber);color:var(--amber-ink);padding:12px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warnb{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.big{width:100%;padding:14px;font-size:22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.navbtn{appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 4px;cursor:pointer;display:grid;gap:2px;justify-items:center;font:800 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;position:relative}
.navbtn small{font:400 10px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:none}
.navbtn .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.svc{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)} .svc .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.whl{list-style:none;margin:0;padding:0;display:grid;gap:8px} .whl li{display:flex;justify-content:space-between;align-items:center;gap:10px} .whl li>span:first-child{min-width:0}
.btns2{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.fsel{display:block;width:100%;margin-top:4px;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 8px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px}
.tag{font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* home */
.home-body{align-content:center;gap:20px}
.logo{text-align:center;display:grid;gap:8px;justify-items:center}
.logo svg{width:150px;height:auto}
.logo h1{font-size:clamp(48px,14vw,72px);line-height:.85;color:var(--ink)}
.logo h1 span{color:var(--amber)}
.ticker{overflow:hidden;border-block:1px solid var(--line);padding-block:8px;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker-track{display:inline-block;animation:tick 40s linear infinite;font:500 13px var(--f-mono)}
.ticker-track span{margin-right:26px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.daily{border-left:4px solid var(--ice)}
.daily h2{font-size:30px}
.daily .row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;padding:9px;cursor:pointer;font:500 13px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--amber)}
.continue{display:grid;justify-items:center;gap:3px}
.continue small{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:none}

/* market */
.mk-head{background:var(--panel);border-bottom:1px solid var(--line);display:grid;gap:4px;padding-block:6px 10px;border-left:5px solid var(--amber)}
.mk-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.mk-top h2{font-size:clamp(24px,7vw,34px)}
.mk-day{text-align:right;display:grid;gap:2px}
.mk-day b{font:500 22px/1 var(--f-mono)}
.cash{font:800 clamp(30px,9vw,40px)/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mk-sub{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12.5px/1.3 var(--f-mono)}
.note{color:var(--bad)} .note.ok{color:var(--good)}
.news{border-left:3px solid var(--amber);padding:4px 0 4px 10px;font-size:13px}
.goods{list-style:none;margin:0;padding:0}
.good{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;appearance:none}
.good:hover{background:var(--panel)}
.good .qty{width:34px;height:26px;border-radius:13px;background:var(--bad);color:#fff;display:grid;place-items:center;font:700 12px var(--f-mono)}
.good .qty.none{background:none}
.good .nm{display:grid;gap:1px;min-width:0}
.good .nm b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.good .nm small{font:400 11px var(--f-mono);color:var(--muted)}
.good .px{text-align:right;display:grid;gap:1px}
.good .px b{font:500 16px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.good .px small{font:400 11px var(--f-mono);color:var(--muted)}
.good.make .px b{color:var(--good)} .good.want .px b{color:var(--amber)}
.good.na{cursor:default;opacity:.45}
.good.na:hover{background:none}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter{display:grid;gap:4px}
.meter .lbl{display:flex;justify-content:space-between;font:500 12px var(--f-mono)}
.meter .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--ice)}
.meter.hull .track i{background:var(--good)}
.meter.low .track i{background:var(--bad)}
.fuelline{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--muted)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(3,6,12,.6);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;background:var(--sheet);border-top:1px solid var(--amber);border-radius:12px 12px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:rgba(236,230,216,.3);margin:8px auto 0}
.sheet-head{padding-block:10px 4px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.sheet-head h2{font-size:28px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding-block:8px 12px;display:grid;gap:12px;align-content:start}
.sheet-foot{padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;border-top:1px solid rgba(242,169,59,.25)}
.sheet .kv dt{color:#c9b9a8}
.trade-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=number]{background:var(--deep);border:1px solid var(--line);border-radius:4px;padding:9px;width:100%;font-family:var(--f-mono)}

/* move list as a transit line */
.line{list-style:none;margin:0;padding:0;position:relative}
.line h4{margin:10px 0 4px 40px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left;position:relative;appearance:none}
.stop::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:5px;background:var(--good)}
.stop.star::before{background:var(--ice)}
.stop i{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--good);border:0}
.stop.star i{background:var(--ice)}
.stop.here i{background:var(--sheet);border:6px solid var(--good)}
.stop.star.here i{border-color:var(--ice)}
.stop .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stop .nm b{font:800 21px/1.05 var(--f-display);letter-spacing:.02em}
.stop .nm span{font:700 14px var(--f-display);letter-spacing:.04em;color:#d8c8b6;text-transform:uppercase}
.stop.here .nm b{color:var(--good)}
.stop .cost{font:500 12px var(--f-mono);text-align:right;color:#d8c8b6;white-space:nowrap}
.stop.off .nm,.stop.off .cost{opacity:.5}
.stop:hover{background:rgba(255,255,255,.03)}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(242,169,59,.4);border-radius:4px;overflow:hidden}
.toggle button{appearance:none;border:0;background:transparent;padding:6px 12px;cursor:pointer;font:500 12px var(--f-mono)}
.toggle button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.chart svg{display:block;width:100%;height:auto;max-height:52vh}
.ring{fill:none;stroke:rgba(236,230,216,.15);stroke-width:1}
.ring.ly{stroke-dasharray:3 5}
.ringlbl{fill:#b8a898;font:400 10px var(--f-mono)}
.route{stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.earth{fill:var(--ice)}
.node{cursor:pointer}
.node .dot{fill:var(--good)} .node.star .dot{fill:var(--ice)}
.node.here .dot{fill:var(--amber)}
.node .halo{fill:none;stroke:var(--amber);stroke-width:2}
.node text{fill:var(--ink);font:700 12.5px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.node.dim{opacity:.5}

/* tables in screens and sheets */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.sheet th,.sheet td{border-color:rgba(242,169,59,.18)}
th{font:500 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.sub{display:block;font-size:11.5px;color:var(--muted)}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--panel2)}

/* event sheet meters */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duel b{font:500 26px/1 var(--f-mono)}
.duel .track{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:6px}
.duel .track i{display:block;height:100%;background:var(--good)}

.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;font-size:14px}
.log li .mono{color:var(--muted);font-size:12px;padding-top:2px}
.log li.good span:last-child{color:var(--good)}
.log li.bad span:last-child{color:var(--bad)}
.codex h3{font-size:18px;margin-bottom:6px}
.codex ul{margin:0;padding-left:18px;display:grid;gap:6px}
.codex .tbl{overflow-x:auto}
.body>*,.codex,.codex>div{min-width:0}
.codex ul.orgs{list-style:none;padding:0;display:grid;gap:12px}
.orgs li{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.orgs .sub{font-size:12.5px}
.codex table{min-width:520px}
.contract{border:1px solid var(--amber);border-radius:4px;padding:12px;display:grid;gap:8px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* depth v1: standing and acts */
.rep{color:var(--ice)}
.acts,.standing{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acts li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.acts .tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--amber-ink)}
.acts li.done .tick{background:var(--good);border-color:var(--good)}
.acts li.done b{color:var(--good)}
.standing li{display:grid;grid-template-columns:minmax(0,1fr) 84px 64px;gap:10px;align-items:center;font-size:14px}
.standing .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.standing .track i{display:block;height:100%;background:var(--ice)}
.standing .here span:first-child{color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <section class="screen" id="scr-home"></section>
  <section class="screen" id="scr-market" hidden></section>
  <section class="screen" id="scr-page" hidden></section>
  <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div></div>
</div>

<script>
'use strict';
/* Forkline engine v2 (formerly Drift Trader) — hard-science economy. Pure functions; no DOM. */
const VE = 9.0;            // km/s exhaust velocity, nuclear thermal (~900 s Isp)
const DRY = 30;            // t ship dry mass
const HOLD0 = 120;         // t starting hold (cargo + propellant)
const HE3_PER_DAY = 0.15;  // kg He-3 burned per interstellar travel day
const DAYS_MAX = 7;        // longest real leg scales to this many days
const SPREAD_SOL = 0.005, SPREAD_STAR = 0.03;
const DEBT_RATE = 0.0075;  // per game day, common-frame clock
const START = { cash: 30e6, debt: 60e6, prop: 80, hull: 100, days: 45 };

const CUR = {
  USD: { sym: '$', name: 'Dollar stablecoin', perUSD: 1, sigma: 0 },
  EUR: { sym: '€', name: 'Digital euro', perUSD: 1 / 1.1193, sigma: 0.004 },
  CNY: { sym: '¥', name: 'e-CNY', perUSD: 6.686, sigma: 0.003 }
};

// Prices are USD per kg. unit/kg = trade lot.
const GOODS = [
  { id: 'water', name: 'Water ice',            unit: 't',     kg: 1000, min: 100,   max: 1700,  cap: [15, 40] },
  { id: 'prop',  name: 'Propellant',           unit: 't',     kg: 1000, min: 100,   max: 1800,  cap: [50, 140] },
  { id: 'metal', name: 'Structural metals',    unit: 't',     kg: 1000, min: 150,   max: 4000,  cap: [10, 30] },
  { id: 'nitro', name: 'Nitrogen (ammonia)',   unit: 't',     kg: 1000, min: 300,   max: 9000,  cap: [5, 20] },
  { id: 'food',  name: 'Hydroponic food',      unit: 't',     kg: 1000, min: 500,   max: 9000,  cap: [5, 20], perish: 0.03 },
  { id: 'elec',  name: 'Electronics & spares', unit: 'crate', kg: 100,  min: 8000,  max: 40000, cap: [10, 40] },
  { id: 'leu',   name: 'Reactor fuel (LEU)',   unit: 'crate', kg: 100,  min: 6000,  max: 30000, cap: [3, 12], restricted: true },
  { id: 'pgm',   name: 'Platinum-group metals',unit: 'kg',    kg: 1,    min: 45000, max: 95000, cap: [50, 300] },
  { id: 'he3',   name: 'Helium-3',             unit: '100 g', kg: 0.1,  min: 9e6,   max: 36e6,  cap: [5, 25] },
  { id: 'samp',  name: 'Exoplanet samples',    unit: '100 g', kg: 0.1,  min: 1e6,   max: 60e6,  cap: [2, 10] }
];

const STATIONS = [
  { id: 'leo', name: 'LEO Exchange', place: 'Low Earth orbit · 400 km', bloc: 'USD', sys: 'sol', km: 6771, ang: 200,
    make: ['elec', 'leu', 'food'], want: ['he3', 'pgm', 'samp', 'water', 'prop'], svc: ['bank', 'shipyard', 'repair'],
    sells: ['prop'], px: { water: [900, 1700], prop: [900, 1600], he3: [18e6, 24e6], pgm: [60000, 75000], samp: [12e6, 30e6], elec: [8000, 15000], leu: [6000, 12000], food: [3500, 5000] } },
  { id: 'gw', name: 'Gateway Depot', place: 'Near-rectilinear halo orbit', bloc: 'EUR', sys: 'sol', km: 2.5e5, ang: 300,
    make: ['prop'], want: ['water', 'metal'], svc: ['bank', 'insurance', 'repair'],
    px: { water: [500, 900], prop: [350, 600], metal: [1500, 2600] } },
  { id: 'art', name: 'Artemis Base', place: 'Shackleton rim · lunar south pole', bloc: 'USD', sys: 'sol', km: 3.84e5, ang: 345,
    make: ['water', 'prop'], want: ['elec', 'nitro', 'food', 'leu'], svc: [],
    px: { water: [200, 400], prop: [180, 350] } },
  { id: 'ilrs', name: 'ILRS Station', place: 'Lunar south pole · China-led', bloc: 'CNY', sys: 'sol', km: 3.84e5, ang: 15,
    make: ['he3', 'metal'], want: ['elec', 'nitro', 'food'], svc: ['bank'],
    px: { he3: [9e6, 14e6], metal: [150, 600] } },
  { id: 'mars', name: 'Utopia Base', place: 'Utopia Planitia · Mars surface', bloc: 'CNY', sys: 'sol', km: 2.25e8, ang: 70,
    make: ['prop', 'food', 'nitro'], want: ['elec', 'leu', 'pgm'], svc: ['yard', 'repair'] },
  { id: 'ceres', name: 'Ceres Station', place: 'Occator crater · Ceres', bloc: 'EUR', sys: 'sol', km: 4.1e8, ang: 98,
    make: ['water', 'nitro'], want: ['food', 'elec', 'leu'], svc: ['warehouse'],
    px: { water: [100, 250], nitro: [300, 900] } },
  { id: 'psy', name: 'Psyche Works', place: '16 Psyche · metal asteroid', bloc: 'USD', sys: 'sol', km: 4.4e8, ang: 130,
    make: ['pgm', 'metal'], want: ['food', 'prop', 'elec'], svc: ['foundry'],
    px: { pgm: [45000, 55000] } },
  { id: 'prox', name: 'Proxima b Outpost', place: 'Proxima Centauri · 4.24 ly', bloc: 'USD', sys: 'star', pos: [-1.55, -1.18, -3.77], ang: 217,

  const prop=held('prop'),h3=held('he3'),reasons=[];
  if(S.day+days>S.total)reasons.push(`needs ${days} days, ${S.total-S.day} left`);
  if(!inter&&burn>prop+1e-6){const fr=1-Math.exp(-dv(S.loc,dest)/veP());reasons.push(`short ${tons(Math.max(burn-prop,fr*(DRY+massT()-prop)/(1-fr)-prop))} propellant`);}
  if(inter&&he3>h3+1e-6)reasons.push(`short ${((he3-h3)*.1).toFixed(2)} kg He-3${ST(S.loc).sys==='sol'&&!(S.mkt.data.he3&&S.mkt.data.he3.stock)?' (sold at ILRS Station and at the stars)':''}`);
  let loadProp=0,loadHe3=0;
  if(!inter){const fr=1-Math.exp(-dv(S.loc,dest)/veP());const need=fr*(DRY+massT()-prop)/(1-fr);loadProp=Math.max(0,Math.ceil((need-prop)*10)/10);}
  else loadHe3=Math.max(0,Math.ceil(he3-h3-1e-9));
  return {days,inter,dv:dv(S.loc,dest),burn,he3,ok:!reasons.length,reasons,loadProp,loadHe3,lag:lagDays(S.loc,dest),interest:S.debt*(Math.pow(1+DEBT_RATE,days)-1)+(typeof loansUSD==='function'?Object.keys(BANKS).reduce((a,c)=>a+loanUSD(c)*(Math.pow(1+BANKS[c].rate,days)-1),0):0)};
}
function jump(){
  if(!sel||S.over||S.event)return;const p=plan(sel);if(!p.ok)return;
  const from=ST(S.loc).name;
  if(p.inter)removeCargo('he3',p.he3);else removeCargo('prop',p.burn);
  const before=S.debt;S.debt=S.debt>0?S.debt*Math.pow(1+DEBT_RATE,p.days):0;
  S.day+=p.days;
  if(held('food')>0){const lost=held('food')*(1-Math.pow(1-G('food').perish,p.days));removeCargo('food',lost);if(lost>=.05)log(`${lost.toFixed(1)} t of food spoiled in transit.`,'bad');}
  S.loc=sel;sel=null;selGood=null;
  log(`${from} to ${ST(S.loc).name}: ${p.days} ${p.days>1?'days':'day'}, ${p.inter?(p.he3*.1).toFixed(2)+' kg He-3':tons(p.burn)+' propellant at Δv '+p.dv.toFixed(1)+' km/s'}.${before?` Debt now ${usd(S.debt)}.`:''}`);
  if(S.charter&&S.charter.to===S.loc){const pay=S.charter.pay*.6;S.cash+=pay;log(`Supplies delivered: ${S.charter.tons} t ${G(S.charter.good).name}. Balance paid: ${usd(pay)}.`,'good');S.charter=null;gainRep(S.loc,8);}
  if(S.charter&&S.day>S.charter.by)lapseContract('lapsed');
  if(S.contract&&S.day>S.contract.by){log(`Colony request expired: ${amt(S.contract.units,G(S.contract.good))} ${G(S.contract.good).name} to ${ST(S.contract.to).name}. They found someone else.`,'bad');S.contract=null;}
  arrive(false);save();closeSheet();go('market');showEvent();
}
// Refuelling depots: every Solar System station keeps a propellant reserve for ships, and every star colony
// (plus the ILRS He-3 plant) keeps a He-3 reserve. Loading fuel draws on the reserve, not the day's trade stock.
// Fuel comes from the day's trade stock first; any shortfall comes from the reserve at a 25% premium.
const isDepot=(id,g)=>g==='prop'?ST(id).sys==='sol':(ST(id).sys==='star'||ST(id).make.includes('he3'));
const RESERVE_MULT=1.25;
function fuelCost(o,q){const fromStock=Math.min(q,Math.max(0,o.stock||0)),px=buyAt(S.loc,o.local);return {cost:fromStock*px+(q-fromStock)*px*RESERVE_MULT,reserve:q-fromStock};}
function fuelQuote(dest){
  const p=plan(dest),m=S.mkt.data;
  if(p.inter){const o=m.he3;if(!o||p.loadHe3<=0)return null;const q=isDepot(S.loc,'he3')?p.loadHe3:Math.min(p.loadHe3,o.stock||0);if(q<=0)return null;const c=fuelCost(o,q);return {id:'he3',q,cost:c.cost,reserve:c.reserve,label:`${(q*.1).toFixed(1)} kg He-3${c.reserve>1e-9?' (part from reserve, +25%)':''}`,partial:q<p.loadHe3-1e-9};}
  const o=m.prop;if(!o||p.loadProp<=0)return null;const q=Math.min(isDepot(S.loc,'prop')?p.loadProp:Math.min(p.loadProp,o.stock||0),Math.max(0,Math.floor(freeT()*10)/10));if(q<=0)return null;const c=fuelCost(o,q);return {id:'prop',q,cost:c.cost,reserve:c.reserve,label:tons(q)+' propellant'+(c.reserve>1e-9?' (part from reserve, +25%)':''),partial:q<p.loadProp-1e-9};
}
// Can the probe leave this station at all, using cash or fuel credit?
function canMoveSomewhere(){
  for(const s of STATIONS){if(s.id===S.loc)continue;const p=plan(s.id);if(S.day+p.days>S.total)continue;if(p.ok)return true;
    const f=fuelQuote(s.id);if(!f||f.partial)continue;if(f.cost<=S.cash||S.debt+f.cost*creditMult()<=CREDIT_LIMIT)return true;}
  return false;}
// STA emergency tanker: cheapest way out, 50% surcharge added to debt (ignores the credit limit), one day.
function emergencyQuote(){let best=null;
  for(const s of STATIONS){if(s.id===S.loc)continue;const p=plan(s.id),add=S.day+1+p.days<=S.total?1:0;if(S.day+add+p.days>S.total)continue;
    const f=fuelQuote(s.id);if(!f||f.partial)continue;const cost=f.cost*1.5;if(!best||cost<best.cost)best={dest:s.id,f,cost,wait:add};}
  return best;}
function emergencyFuel(){const e=emergencyQuote();if(!e)return;
  S.debt+=e.cost;S.mkt.data[e.f.id].stock=Math.max(0,S.mkt.data[e.f.id].stock-e.f.q);addCargo(e.f.id,e.f.q,e.f.cost);
  if(e.wait){S.day+=1;S.debt*=1+DEBT_RATE;}
  log(`STA emergency tanker delivered ${e.f.label}. Debt +${usd(e.cost)} (50% emergency surcharge${e.wait?', 1 day':''}).`,'bad');
  save();closeSheet();go('market');openRoute(e.dest);}
// Jettison the least valuable cargo per tonne until the fuel fits
function jettisonFor(needT){const order=Object.keys(S.cargo).filter(id=>id!=='prop'&&id!=='he3').sort((a,b)=>(S.cargo[a].cost/S.cargo[a].q/(G(a).kg/1000))-(S.cargo[b].cost/S.cargo[b].q/(G(b).kg/1000)));
  let room=freeT();const dropped=[];
  for(const id of order){if(room>=needT-1e-9)break;const g=G(id),perLot=g.kg/1000,lots=Math.min(held(id),Math.ceil((needT-room)/perLot-1e-9));removeCargo(id,lots);room+=lots*perLot;dropped.push(`${amt(lots,g)} ${g.name.toLowerCase()}`);}
  if(dropped.length)log(`Jettisoned ${dropped.join(', ')} with no marker buoy. That makes it jetsam, not lagan.`,'bad');save();render();}
function routeHelp(dest,p,fq){const out=[];
  const holdShort=!p.inter&&p.loadProp>0&&freeT()+1e-9<p.loadProp;
  if(holdShort)out.push(`<p class="small warn">Hold too full for this burn: it needs ${tons(p.loadProp)} more propellant and you have ${tons(Math.max(0,freeT()))} free. Sell or jettison cargo${fq&&fq.partial?', or load what fits and refuel at a stop on the way':''}.</p>`);
  if(fq&&!fq.partial&&fq.cost>S.cash&&S.debt+fq.cost*creditMult()>CREDIT_LIMIT)out.push('<p class="small warn">Fuel credit is maxed out. Sell cargo, take a supply contract, or call the STA tanker.</p>');
  const fixable=fq&&!fq.partial;
  if(!fixable){const stops=STATIONS.filter(s=>s.id!==S.loc&&s.id!==dest&&s.sys==='sol'&&ST(dest).sys==='sol'&&plan(s.id).ok).sort((a,b)=>dv(a.id,dest)-dv(b.id,dest)).slice(0,2);
    if(stops.length)out.push(`<p class="small">Refuel on the way: ${stops.map(s=>`<button class="linkbtn" type="button" data-via="${s.id}">${short(s.name)}</button>`).join(' or ')} is in reach now, and every Solar System station refuels ships.</p>`);}
  if(holdShort)out.push(`<p class="small"><button class="linkbtn" type="button" id="r-jettison">Jettison cargo to make room</button></p>`);
  if(!canMoveSomewhere()){const e=emergencyQuote();
    out.push(e?`<p class="small warn">Stranded: no fuel you can pay for here.</p><p class="small"><button class="linkbtn" type="button" id="r-sta">Call the STA emergency tanker</button>: ${e.f.label} for ${short(ST(e.dest).name)}, ${usd(e.cost)} added to debt (50% surcharge${e.wait?', 1 day':''}).</p>`
             :'<p class="small warn">Stranded with no days left to wait for a tanker. End the mission from the Port screen.</p>');}
  return out.join('');}
const CREDIT_LIMIT=150e6;
let DEBT_HALYARD_ONLY=true;   // the commissioning debt is owed to Halyard, which takes payment only at its own stops
const HALYARD_STOPS=()=>STATIONS.filter(s=>s.sys==='sol'&&s.bloc==='USD');
const canRepayDebt=()=>!!S&&ST(S.loc).sys==='sol'&&(!DEBT_HALYARD_ONLY||ST(S.loc).bloc==='USD');
// Cash needed to fuel to the cheapest in-system stop from here (0 if fuel aboard already covers one)
// Cash to buy one full refuel here for the cheapest in-system hop, ignoring fuel already aboard (it will be burned)
function fuelReserve(){let best={cost:Infinity,to:null};const po=S.mkt.data.prop;if(ST(S.loc).sys!=='sol'||!po)return {cost:0,to:null};
  for(const s of STATIONS){if(s.id===S.loc||s.sys!=='sol')continue;const fr=1-Math.exp(-dv(S.loc,s.id)/veP()),need=fr*(DRY+massT()-held('prop'))/(1-fr),c=fuelCost(po,need).cost;if(c<best.cost)best={cost:c,to:s.id};}
  return best.to?best:{cost:0,to:null};}
function loadFuel(dest,credit){
  const f=fuelQuote(dest);if(!f)return;
  if(credit){if(S.debt+f.cost*creditMult()>CREDIT_LIMIT){flashMsg=`Fuel credit stops at ${usd(CREDIT_LIMIT)} of debt.`;return refreshSheet();}const add=f.cost*creditMult();S.stats.fuel=(S.stats.fuel||0)+add;S.debt+=add;S.mkt.data[f.id].stock=Math.max(0,S.mkt.data[f.id].stock-f.q);addCargo(f.id,f.q,f.cost);log(`Loaded ${f.label} on fuel credit. Debt +${usd(add)} (${Math.round((creditMult()-1)*100)}% credit fee). Halyard thanks you.`,'bad');}
  else{if(f.cost>S.cash){flashMsg='Not enough cash. Use fuel credit or sell cargo first.';return refreshSheet();}S.cash-=f.cost;S.stats.fuel=(S.stats.fuel||0)+f.cost;S.mkt.data[f.id].stock=Math.max(0,S.mkt.data[f.id].stock-f.q);addCargo(f.id,f.q,f.cost);log(`Loaded ${f.label} for ${usd(f.cost)}.`);}
  save();render();
}


/* ---------- station services (v10) ---------- */
// Banks: each bloc lends in its own currency. Balances grow daily on the common clock (lazy: {bal, day}).
const BANKS={USD:{name:'Halyard Bank',home:'leo',rate:.006,base:30e6},EUR:{name:'EDSD Credit',home:'gw',rate:.005,base:25e6},CNY:{name:'Guanghan Bank',home:'ilrs',rate:.0045,base:20e6}};
const LOAN_FEE=.01,LINE_PER_REP=.7e6,SAV_RATE=.002;
const grow=(a,r)=>a&&a.bal?a.bal*Math.pow(1+r,Math.max(0,S.day-a.day)):0;
const loanLocal=c=>grow(S.loans&&S.loans[c],BANKS[c].rate);
const loanUSD=c=>loanLocal(c)/fxNow(c);
const loansUSD=()=>S&&S.loans?Object.keys(BANKS).reduce((a,c)=>a+loanUSD(c),0):0;
const savUSD=()=>S&&S.sav?grow(S.sav,SAV_RATE):0;
const bankLine=c=>BANKS[c].base+LINE_PER_REP*repOf(BANKS[c].home);
const bankRoom=c=>Math.max(0,bankLine(c)-loanUSD(c));
const repaysHere=c=>ST(S.loc).sys==='sol'&&ST(S.loc).bloc===c;
function borrow(c,v){const B=BANKS[c];v=Math.min(v,bankRoom(c));if(v<1e5||S.loc!==B.home)return;
  const local=v*fxNow(c)*(1+LOAN_FEE);S.loans[c]={bal:loanLocal(c)+local,day:S.day};S.cash+=v;
  log(`${B.name} lent ${usd(v)}${c==='USD'?'':` (${money(v*fxNow(c),CUR[c].sym)})`} at ${(B.rate*100).toFixed(2)}% a day, plus a 1% fee.`);save();render();}
function repayBank(c,v){const owe=loanUSD(c);v=Math.min(v,owe,S.cash);if(v<=0||!repaysHere(c))return;
  const left=loanLocal(c)-v*fxNow(c);S.loans[c]=v>=owe-1?null:{bal:left,day:S.day};S.cash-=v;
  log(`Repaid ${usd(v)} to ${BANKS[c].name}.${S.loans[c]?` ${usd(loanUSD(c))} still owed.`:' Loan closed.'}`,'good');save();render();}
// STA Treasury: deposits earn less than any loan costs, so borrowing to save never pays.
function deposit(v){v=Math.min(v,S.cash);if(v<=0||ST(S.loc).sys!=='sol')return;S.sav={bal:savUSD()+v,day:S.day};S.cash-=v;log(`Deposited ${usd(v)} with the STA Treasury.`);save();render();}
function withdraw(v){v=Math.min(v,savUSD());if(v<=0||ST(S.loc).sys!=='sol')return;const left=savUSD()-v;S.sav=left>1?{bal:left,day:S.day}:null;S.cash+=v;log(`Withdrew ${usd(v)} from the STA Treasury.`);save();render();}

// Hull and cargo insurance (Gateway) and hull plating (Utopia)
const POLICY_DAYS=10,POLICY_BASE=2.5e6,HULL_PT=150000;
const insured=()=>!!(S&&S.policy&&S.day<=S.policy.until);
const cargoBasis=()=>Object.entries(S.cargo).filter(([id])=>id!=='prop'&&id!=='he3').reduce((a,[,c])=>a+c.cost,0);
const premium=()=>POLICY_BASE+.01*cargoBasis();
function buyPolicy(){const p=premium();if(p>S.cash)return;S.cash-=p;const from=insured()?S.policy.until:S.day;S.policy={until:Math.min(S.total,from+POLICY_DAYS)};
  log(`Hull and cargo policy bound through day ${S.policy.until}. Premium ${usd(p)}.`);save();render();}
const dmgOf=n=>Math.round(n*(S&&S.plate?.6:1));
function hullHit(n){n=dmgOf(n);S.hull=Math.max(0,S.hull-n);let t=`Hull −${n}.`;
  if(insured()&&n>0){const pay=n*HULL_PT;S.cash+=pay;t+=` Your policy paid ${usd(pay)}.`;}return {n,t};}

// Engine yard (Utopia)
const ENGINE_COST=[0,10e6,25e6],PLATE_COST=15e6;
function buyEngine(){const lv=S.eng+1;if(lv>2||S.cash<ENGINE_COST[lv])return;S.cash-=ENGINE_COST[lv];S.eng=lv;
  log(`Engine tune ${lv} installed. Exhaust velocity ${veP().toFixed(1)} km/s.`,'good');save();render();}
function buyPlate(){if(S.plate||S.cash<PLATE_COST)return;S.cash-=PLATE_COST;S.plate=true;log('Hull plating fitted. Damage cut by 40%.','good');save();render();}

// Bonded warehouse (Ceres): fee accrues per tonne-day and is paid on withdrawal
const WH_FEE=15000;
function whAccrue(){for(const [id,l] of Object.entries(S.wh)){l.owed+=l.q*G(id).kg/1000*WH_FEE*Math.max(0,S.day-l.day);l.day=S.day;}}
const whTons=()=>Object.entries(S.wh).reduce((a,[id,l])=>a+l.q*G(id).kg/1000,0);
const whOwed=()=>Object.entries(S.wh).reduce((a,[id,l])=>a+l.owed+l.q*G(id).kg/1000*WH_FEE*Math.max(0,S.day-l.day),0);
function whStore(id){if(S.loc!=='ceres')return;whAccrue();const q=held(id);if(q<=0)return;const basis=removeCargo(id,q);
  const l=S.wh[id]||{q:0,cost:0,owed:0,day:S.day};l.q+=q;l.cost+=basis;S.wh[id]=l;log(`Stored ${amt(q,G(id))} ${G(id).name} in the Ceres bonded warehouse.`);save();render();}
function whTake(id){if(S.loc!=='ceres')return;whAccrue();const l=S.wh[id];if(!l)return;const per=G(id).kg/1000;
  const q=Math.min(l.q,Math.floor(freeT()/per+1e-9));if(q<=0){log('No room in the hold to withdraw that.','bad');return render();}
  const share=q/l.q,fee=l.owed*share;if(fee>S.cash){log(`Storage fee ${usd(fee)} is more than your cash.`,'bad');return render();}
  S.cash-=fee;addCargo(id,q,l.cost*share);l.q-=q;l.cost-=l.cost*share;l.owed-=fee;if(l.q<1e-6)delete S.wh[id];
  log(`Withdrew ${amt(q,G(id))} ${G(id).name} from the warehouse. Storage fee ${usd(fee)}.`);save();render();}

// Fork foundry (Psyche) and fleet. A fork shuttles an assigned in-system route and remits income daily.
const FORK_CASH=25e6,FORK_METAL=10,FORK_PGM=10,FLEET_MAX=3,FORK_DAY=1.3e6,FORK_UPKEEP=.2e6,FORK_REPAIR=1e6,FORK_SALVAGE=.2;
const TRAITS={
  hauler:{name:'Hauler',note:'+20% route income',boot:'It asks for the route list before it asks what year it is.'},
  careful:{name:'Careful',note:'60% fewer incidents, −5% income',boot:'Its first act is a full diagnostic. Then it runs a second one.'},
  gambler:{name:'Gambler',note:'Income swings wide, +5% on average',boot:'It wants to know which route pays most, and nothing about which one is safe.'},
  diplomat:{name:'Diplomat',note:'+1 standing a day at both route stops',boot:'It has already messaged both colony councils on its route to introduce itself.'},
  frugal:{name:'Frugal',note:'Half the upkeep',boot:'It switched off two redundant heaters before you finished the handshake.'},
  restless:{name:'Restless',note:'+10% income; drifts to a new trait more often',boot:'It agrees to the route. You are not sure it means it.'}};
const TRAIT_IDS=Object.keys(TRAITS);
const routeFactor=(a,b)=>.7+.07*dv(a,b);
const incidentP=(a,b,t)=>(.02+.004*dv(a,b))*(t==='careful'?.4:1);
const traitMult=t=>t==='hauler'?1.2:t==='careful'?.95:t==='gambler'?1.05:t==='restless'?1.1:1;
function forkEst(a,b,t){if(a===b)return 0;const inc=FORK_DAY*routeFactor(a,b)*traitMult(t),p=incidentP(a,b,t);return inc*(1-p)-p*FORK_REPAIR-FORK_UPKEEP*(t==='frugal'?.5:1);}
function forkDay(f,day){const r=rngFor(S.seed,'fk|'+f.n+'|'+day),t=f.trait;
  const noise=t==='gambler'?.2+1.7*r():.6+.8*r();let inc=FORK_DAY*routeFactor(f.a,f.b)*(t==='gambler'?1:traitMult(t))*noise;
  const hit=r()<incidentP(f.a,f.b,t);if(hit)inc=-FORK_REPAIR;
  return {net:inc-FORK_UPKEEP*(t==='frugal'?.5:1),hit,drift:r()};}
function settleFleet(){if(!S||!S.fleet||!S.fleet.length)return;const end=Math.min(S.day,S.total);let tot=0,any=false;const notes=[];
  for(const f of S.fleet){while(f.paid<end){f.paid++;any=true;const o=forkDay(f,f.paid);tot+=o.net;f.earned+=o.net;
      if(o.hit)notes.push(`${f.name} had a reactor incident (−${usd(FORK_REPAIR)})`);
      if(f.trait==='diplomat'){gainRep(f.a,1);gainRep(f.b,1);}
      if(f.paid%7===0&&o.drift<(f.trait==='restless'?.25:.05)){const opts=TRAIT_IDS.filter(t=>t!==f.trait),nt=opts[Math.floor(rngFor(S.seed,'drift|'+f.n+'|'+f.paid)()*opts.length)];
        notes.push(`${f.name} drifted from ${TRAITS[f.trait].name} to ${TRAITS[nt].name}`);f.trait=nt;}}}
  if(!any)return;S.cash+=tot;if(S.cash<0){S.debt+=-S.cash;S.cash=0;}
  log(`Fleet remitted ${tot<0?'−':''}${usd(Math.abs(tot))}.${notes.length?' '+notes.join('. ')+'.':''}`,tot>=0?'good':'bad');}
function foundryNeeds(){const n=[];if(S.fleet.length>=FLEET_MAX)n.push(`fleet is full (${FLEET_MAX})`);if(S.cash<FORK_CASH)n.push(`${usd(FORK_CASH)} cash`);
  if(held('metal')<FORK_METAL)n.push(`${FORK_METAL} t structural metals (${qfmt(held('metal'))} aboard)`);if(held('pgm')<FORK_PGM)n.push(`${FORK_PGM} kg platinum-group metals (${qfmt(held('pgm'))} aboard)`);return n;}
function buildFork(a,b){if(S.loc!=='psy'||foundryNeeds().length||a===b)return;
  S.cash-=FORK_CASH;removeCargo('metal',FORK_METAL);removeCargo('pgm',FORK_PGM);S.forkN++;
  const n=S.forkN,t=TRAIT_IDS[Math.floor(rngFor(S.seed,'trait|'+n+'|'+S.day)()*TRAIT_IDS.length)];
  const f={n,name:'FL-'+n,trait:t,a,b,paid:S.day,earned:0,born:S.day};S.fleet.push(f);
  log(`${f.name} booted at Psyche Works. Trait: ${TRAITS[t].name}. Route ${short(ST(a).name)} ⇄ ${short(ST(b).name)}.`,'good');save();
  openSheet({locked:true,eyebrow:'Fork foundry · Psyche Works',title:`${f.name} is awake`,body:`<p>${TRAITS[t].boot}</p><dl class="kv"><dt>Trait</dt><dd>${TRAITS[t].name}</dd><dt>Effect</dt><dd>${TRAITS[t].note}</dd><dt>Route</dt><dd>${short(ST(a).name)} ⇄ ${short(ST(b).name)}</dd><dt>Estimated</dt><dd>${usd(forkEst(a,b,t))} a day</dd></dl><p class="small" style="color:#c9b9a8">Nobody chooses their fork's trait, including you. Traits can drift over time.</p>`,
    actions:[{label:'Continue',fn:()=>{closeSheet();render();}}]});}
function openForkRoute(n){const f=n?S.fleet.find(x=>x.n===n):null,sol=STATIONS.filter(s=>s.sys==='sol');let a=f?f.a:'leo',b=f?f.b:'psy';
  const opts=v=>sol.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${short(s.name)}</option>`).join('');
  openSheet({title:f?`Retask ${f.name}`:'Build a fork',eyebrow:f?`${TRAITS[f.trait].name} · earned ${usd(f.earned)}`:`${usd(FORK_CASH)} + ${FORK_METAL} t metals + ${FORK_PGM} kg PGM`,
    body:`<p class="small">Pick the two stops the fork shuttles between. Longer routes (more Δv) pay more and have more incidents.</p><div class="grid2"><label class="small">From<select class="fsel" id="fa">${opts(a)}</select></label><label class="small">To<select class="fsel" id="fb">${opts(b)}</select></label></div><p class="small mono" id="fest"></p>`,

/* ---------- trading ---------- */
function buy(id,q){const o=S.mkt.data[id];if(!o)return;const g=G(id),p=buyAt(S.loc,o.local);q=Math.min(q,o.stock,Math.floor(S.cash/p),Math.floor(freeT()/(g.kg/1000)+1e-9));if(q<=0)return;o.stock-=q;S.cash-=q*p;addCargo(id,q,q*p);log(`Bought ${amt(q,g)} ${g.name} for ${usd(q*p)}.`);save();closeSheet();render();}
function sell(id,q){const o=S.mkt.data[id];if(!o)return;const g=G(id),p=sellAt(S.loc,o.local,undefined,id);q=Math.min(q,held(id));if(q<=0)return;const basis=removeCargo(id,q);S.cash+=q*p;const pl=q*p-basis;if(pl>0)S.stats.profitSales++;if(ST(S.loc).sys==='star')S.stats.starSales++;if(o.role==='want'&&q*p>=1e6)gainRep(S.loc,Math.min(10,Math.max(2,Math.floor(q*p/4e6))),true);log(`Sold ${amt(q,g)} ${g.name} for ${usd(q*p)} (${pl>=0?'+':'−'}${usd(Math.abs(pl))}).`,pl>=0?'good':'bad');save();closeSheet();render();}
function propUSDt(){const o=S.mkt.data.prop;return o&&o.stock?buyAt(S.loc,o.local):null;}
function bestTrades(){
  const m=S.mkt.data,out=[],pp=m.prop?buyAt(S.loc,m.prop.local):null;
  for(const d of STATIONS){if(d.id===S.loc)continue;const p=plan(d.id);if(S.day+p.days>S.total)continue;
    const rDay=Math.max(1,S.day-p.lag),rep=market(S.seed,rDay,d.id);
    let fixed=0,fr=0,fixedT=0,need0=0;const po=m.prop,fc=t=>po&&t>0?fuelCost(po,t).cost:0;
    if(p.inter){const need=Math.max(0,p.he3-held('he3'));if(need>0){if(!(m.he3&&m.he3.stock>=need))continue;fixed=need*buyAt(S.loc,m.he3.local);}}
    else{fr=1-Math.exp(-p.dv/veP());need0=fr*(DRY+massT()-held('prop'))/(1-fr);fixedT=Math.max(0,need0-held('prop'));if(fixedT>0&&!po)continue;fixed=fc(fixedT);}
    const k=p.inter?0:fr/(1-fr);
    for(const g of GOODS){if(g.id==='prop'||g.id==='he3'&&p.inter)continue;const o=m[g.id],t=rep[g.id];if(!o||!o.stock||!t)continue;
      const lotT=g.kg/1000,b=buyAt(S.loc,o.local),sl=sellAt(d.id,t.local,rDay,g.id),marg=k*lotT*(pp||0),unit=sl-b-marg;if(unit<=0)continue;
      const q=Math.min(o.stock,Math.floor(Math.max(0,S.cash-fixed)/(b+marg)),Math.floor(Math.max(0,freeT()-fixedT)/(lotT*(1+k))+1e-9));
      if(q<=0)continue;const sp=g.perish?Math.pow(1-g.perish,p.days):1,xT=p.inter?0:Math.max(0,need0+k*q*lotT-held('prop'))-Math.max(0,need0-held('prop')),prof=q*(sl*sp-b)-(fc(fixedT+xT)-fc(fixedT));if(prof<=0)continue;
      out.push({g:g.id,d:d.id,q,net:prof,trip:fixed,per:prof/p.days,rank:(prof-fixed)/p.days,days:p.days,lag:p.lag});}}
  return out.sort((a,b)=>b.rank-a.rank).slice(0,8);
}
function charterFuel(c){const fr=1-Math.exp(-dv(S.loc,c.to)/veP());const need=fr*(DRY+massT()-held('prop')+c.tons)/(1-fr);const t=Math.max(0,need-held('prop'));return {t,cost:t*(propUSDt()||0)};}
const CONTRACT_DAYS=5; // a supply contract must be delivered within this many days of signing
function contractPay(c){
  const hp=held('prop');if(hp<=0||!c.fuelT)return c.pay;
  const basisT=S.cargo.prop.cost/S.cargo.prop.q,refT=c.fuelPay/c.fuelT;if(basisT>=refT)return c.pay;
  const cut=Math.min(hp,c.fuelT)*(refT-basisT);
  return Math.max(1e5,Math.round((c.pay-cut)/1e5)*1e5);}
function openCharters(){if(ST(S.loc).sys!=='sol'||S.charter)return [];const cm=repContractMult(S.loc);return charters(S.seed,S.day,S.loc).filter(c=>!S.taken.includes(S.day+'|'+S.loc+'|'+c.n)).map(c=>{const p=contractPay(c);return {...c,pay:Math.round(p*cm/1e5)*1e5};});}
function lapseContract(why){const c=S.charter;if(!c)return;const adv=c.adv??c.pay*.4;S.debt+=adv;
  log(`Supply contract to ${ST(c.to).name} ${why}. Halyard recovers the ${usd(adv)} advance as debt.`,'bad');if(c.from)gainRep(c.from,-10);S.charter=null;}

/* ---------- events ---------- */
const GOODS_REF=Object.fromEntries(GOODS.map(g=>{const sol=STATIONS.filter(s=>s.sys==='sol');return [g.id,sol.reduce((a,s)=>a+REFp()[g.id][s.id],0)/sol.length];}));
function evDebris(r){S.event={type:'debris',burn:2+Math.round(r()*3)};log('STA conjunction warning on approach to LEO.','bad');}
function evExport(){S.event={type:'export',fee:Math.max(250000,Math.round(held('leu')*GOODS_REF.leu*100*.04))};log(`An ${AGENCY_SHORT[ST(S.loc).bloc]} inspector boards to check the reactor fuel.`,'bad');}
function evStorm(r){S.event={type:'storm',dmg:10+Math.round(r()*12),loss:.1+r()*.2};log('Solar particle event detected.','bad');}
function evFailure(r){S.event={type:'fail',dmg:8+Math.round(r()*8)};log('Coolant pump fault in the reactor loop.','bad');}
function evContract(r){
  const opts=[['he3','leo',5,12],['water','leo',20,40],['elec','prox',5,12],['leu','art',2,6],['food','ceres',8,16],['nitro','ilrs',6,14],['pgm','leo',60,200],['prop','gw',30,60],['samp','leo',2,5]].filter(o=>o[1]!==S.loc);
  const o=opts[Math.floor(r()*opts.length)],g=G(o[0]),units=Math.round(o[2]+(o[3]-o[2])*r());
  S.event={type:'contract',c:{good:g.id,to:o[1],units,unitUSD:Math.round(REFp()[g.id][o[1]]*ROLE_MID.want*g.kg*1.25),by:Math.min(S.total,S.day+4+Math.round(r()*8))}};
}
function resolved(title,text){S.event=null;save();render();if(S.hull<=0)return finish('lost');
  openSheet({title,eyebrow:'Resolved',body:`<p>${text}</p>`,actions:[{label:'Continue',fn:()=>{closeSheet();render();}}],locked:true});}
function showEvent(){
  const e=S.event;if(!e)return;
  if(e.type==='debris')openSheet({locked:true,eyebrow:'Solar Transit Authority · debris',title:'Conjunction warning',body:`<p>The STA's tracking network predicts a close pass with a debris fragment. LEO is the most crowded orbit there is.</p><dl class="kv"><dt>Avoidance burn</dt><dd>−${e.burn} t propellant</dd><dt>Hold course</dt><dd>20%: hull −${dmgOf(30)}</dd></dl>`,
    actions:[{label:'Avoidance burn',fn:()=>{const b=Math.min(e.burn,held('prop'));removeCargo('prop',b);log(`Avoidance burn used ${tons(b)} propellant.`);resolved('Clear',`The burn costs ${tons(b)} of propellant and the fragment passes safely.`);}},{label:'Hold course',kind:'warnb',fn:()=>{if(Math.random()<.2){const h=hullHit(30);log('Debris strike. '+h.t,'bad');resolved('Strike','A fragment punches through a radiator panel. '+h.t);}else{log('Debris passed clear.','good');resolved('Clear','The fragment passes 400 m off the bow.');}}}]});
  else if(e.type==='export')openSheet({locked:true,eyebrow:`${AGENCY[ST(S.loc).bloc]} · export control`,title:'Inspector aboard',body:`<p>${ST(S.loc).name} is outside the dollar bloc. The ${AGENCY[ST(S.loc).bloc]} inspector wants an export license for the ${held('leu')} crates of low-enriched uranium in your hold, and is in no hurry.</p><dl class="kv"><dt>Pay license fee</dt><dd>${usd(e.fee)}</dd><dt>Refuse</dt><dd>LEU impounded</dd></dl>`,
    actions:[{label:`Pay ${usd(e.fee)}`,disabled:S.cash<e.fee,fn:()=>{S.cash-=e.fee;gainRep(S.loc,5);log(`Paid ${usd(e.fee)} export license fee.`);resolved('Licensed','The fuel is cleared for sale here.');}},{label:'Refuse',kind:'warnb',fn:()=>{const q=held('leu');removeCargo('leu',q);gainRep(S.loc,-8);log(`The inspector impounded ${q} crates of LEU.`,'bad');resolved('Impounded',`The inspector impounds ${q} crates of reactor fuel and leaves a receipt.`);}}]});
  else if(e.type==='storm'){
    if(S.shield){log('Rode out a solar particle event in the storm shelter.','good');return resolved('Sheltered','Your storm shelter absorbs the proton flux. No damage.');}
    const ec=held('elec');
    openSheet({locked:true,eyebrow:'Hazard · space weather',title:'Proton storm',body:`<p>A coronal mass ejection is driving a proton storm across your path. Unshielded, it damages systems and electronics cargo.</p><div class="duel"><div><span class="eyebrow">Hull</span><br><b>${S.hull}</b><div class="track"><i style="width:${S.hull}%"></i></div></div><div><span class="eyebrow">Storm dose</span><br><b class="dn">−${e.dmg}</b></div></div><dl class="kv"><dt>Shelter</dt><dd>+1 day · ${usd(S.debt*DEBT_RATE)} interest</dd><dt>Push through</dt><dd>hull −${dmgOf(e.dmg)}${ec?` · ${Math.round(e.loss*100)}% electronics`:''}</dd></dl><p class="small" style="color:#c9b9a8">A storm shelter from the LEO shipyard prevents this.</p>`,
      actions:[{label:'Shelter',disabled:S.day+1>S.total,fn:()=>{S.day+=1;S.debt*=1+DEBT_RATE;S.mkt={day:S.day,loc:S.loc,data:market(S.seed,S.day,S.loc)};log('Sheltered one day from the storm.');resolved('Sheltered','You wait out the storm. Being software, you are not bored, only charged interest. The market has moved a day.');}},{label:'Push through',kind:'warnb',fn:()=>{let t=hullHit(e.dmg).t;if(ec){const l=Math.max(1,Math.round(ec*e.loss));const lb=removeCargo('elec',l);t+=` ${l} crates of electronics ruined.`;if(insured()&&lb>0){S.cash+=lb;t+=` The policy paid ${usd(lb)} for them.`;}}log('Pushed through a proton storm. '+t,'bad');resolved('Damaged',t);}}]});}
  else if(e.type==='fail'){const ec=held('elec');
    openSheet({locked:true,eyebrow:'Systems',title:'Coolant pump fault',body:`<p>The reactor's secondary coolant pump has failed. Spares fix it; without them you run degraded.</p><dl class="kv"><dt>Use 1 crate of spares</dt><dd>${ec?'from your hold':'none aboard'}</dd><dt>Run degraded</dt><dd>hull −${dmgOf(e.dmg)}</dd></dl>`,
      actions:[{label:'Use spares',disabled:!ec,fn:()=>{removeCargo('elec',1);log('Fixed the coolant pump with 1 crate of spares.');resolved('Repaired','The pump is replaced. One crate of electronics used. You have no hands, but the drones do.');}},{label:'Run degraded',kind:'warnb',fn:()=>{const h=hullHit(e.dmg);log('Running degraded. '+h.t,'bad');resolved('Degraded',h.t+' Repair docks are at LEO, Gateway, Utopia and Proxima.');}}]});}
  else if(e.type==='contract'){const c=e.c,g=G(c.good);
    openSheet({locked:true,eyebrow:'Colony request',title:'Standing order',body:`<p>${ST(c.to).name} posts a fixed-price order through the ${AGENCY[ST(c.to).bloc]}, the way the US Department of Energy pre-bought lunar helium-3.</p><dl class="kv"><dt>Deliver</dt><dd>${amt(c.units,g)} ${g.name}</dd><dt>To</dt><dd>${ST(c.to).name}</dd><dt>By</dt><dd>day ${c.by}</dd><dt>Pays</dt><dd>${usd(c.unitUSD*c.units)}</dd></dl><p class="small" style="color:#c9b9a8">No penalty if it expires.</p>`,
      actions:[{label:'Accept',fn:()=>{S.contract=c;log(`Accepted: ${amt(c.units,g)} ${g.name} to ${ST(c.to).name} by day ${c.by}.`,'good');resolved('Accepted','The request is on your Freight screen.');}},{label:'Decline',kind:'ghost',fn:()=>{S.event=null;save();closeSheet();render();}}]});}
}

/* ---------- end ---------- */
function finish(reason){
  settleFleet();if(S.charter)lapseContract('was not delivered before the mission ended');
  S.over=true;S.outcome=reason;const score=reason==='lost'?Math.round(savUSD()):net();
  const prev=bestFor(S.mode==='daily'?S.seed:null,S.total);
  addRecord({seed:S.seed,mode:S.mode,total:S.total,score,date:kstDate(),acts:S.acts.length});
  log(reason==='lost'?'Probe lost. No fork.':`Mission closed. Replication fund ${usd(score)}. Forking.`,reason==='lost'?'bad':'good');save();render();
  const isBest=prev===null||score>prev;
  openSheet({locked:true,eyebrow:S.mode==='daily'?`Daily mission #${dailyNo()}`:'Free mission',title:reason==='lost'?'Probe lost':'Fork ready',
    body:`<dl class="kv"><dt>Cash</dt><dd>${usd(S.cash)}</dd><dt>Commissioning debt</dt><dd>${S.debt>0?'−'+usd(S.debt):'Cleared'}</dd>${savUSD()?`<dt>STA Treasury</dt><dd>${usd(savUSD())}</dd>`:''}${loansUSD()?`<dt>Bank loans</dt><dd>−${usd(loansUSD())}</dd>`:''}${S.fleet.length?`<dt>Fleet forks</dt><dd>${S.fleet.length} running</dd>`:''}<dt>Acts complete</dt><dd>${S.acts.length} / ${ACTS.length}</dd><dt><b>Replication fund</b></dt><dd><b>${usd(score)}</b></dd><dt>Best on this ${S.mode==='daily'?'daily mission':'length'}</dt><dd>${usd(isBest?score:prev)}${isBest&&reason!=='lost'?' · new best':''}</dd></dl>${reason==='lost'?`<p class="small">Hull reached zero. A lost probe cannot fork itself. ${savUSD()>0?'The STA Treasury releases your deposits to a new fork, so the fund is your Treasury balance.':'With nothing in the STA Treasury, the fund is zero.'}</p>`:`<p class="small">Your copy boots with this fund. The original gets a quiet retirement in a data vault.</p>`}`,
    actions:[{label:'Main menu',fn:()=>{closeSheet();go('home');}},{label:'Review log',kind:'ghost',fn:()=>{closeSheet();page('log');}}]});
}

  const s=sheetSpec;if(!s){$('#scrim').hidden=true;return;}
  const sh=$('#sheet');
  sh.innerHTML=`<div class="grab"></div><div class="sheet-head pad"><div><span class="eyebrow" style="color:#c9b9a8">${s.eyebrow||''}</span><h2 id="sh-title">${s.title}</h2></div>${s.headRight||''}</div><div class="sheet-body pad">${s.body}</div>${s.actions&&s.actions.length?`<div class="sheet-foot pad"><div class="btns" id="sh-acts"></div></div>`:''}`;
  const box=$('#sh-acts');

    pageShell(`Port · ${short(st.name)}`,body);wires.forEach(w=>w());

  }
  else if(p==='log'){pageShell('Mission log',`<div class="card"><span class="eyebrow">Mission acts · ${S.acts.length} of ${ACTS.length}</span><ul class="acts">${ACTS.map(a=>{const d=S.acts.includes(a.id);return `<li class="${d?'done':''}"><span class="tick">${d?'✓':''}</span><span><b>${a.name}</b><span class="sub">${a.goal}</span></span></li>`;}).join('')}</ul></div><ul class="log">${S.log.map(l=>`<li class="${l.kind}"><span class="mono">Day ${l.day}</span><span>${l.text}</span></li>`).join('')}</ul>`);}

}

/* ---------- sheets: trade, move, route ---------- */
function openTrade(){
  const build=()=>{const g=G(selGood),o=S.mkt.data[selGood],h=held(selGood),c=S.cargo[selGood],st=ST(S.loc),cur=CUR[st.bloc];
    const bp=buyAt(S.loc,o.local),sp=sellAt(S.loc,o.local,undefined,selGood),perT=g.kg/1000,rb=repSellMult(S.loc,selGood)-1;
    const maxBuy=Math.max(0,Math.min(o.stock,Math.floor(S.cash/bp),Math.floor(freeT()/perT+1e-9)));
    const fq=sel?fuelQuote(sel):null,reserve=fq?fq.cost:0;
    const safeBuy=Math.max(0,Math.min(maxBuy,Math.floor(Math.max(0,S.cash-reserve)/bp)));
    const sellMax=Math.floor(h+1e-9),mx=Math.max(maxBuy,sellMax);
    const q0=suggestQ!==null?Math.min(suggestQ,mx):(mx?Math.min(mx,1):0);suggestQ=null;
    return {title:g.name,eyebrow:`${st.name} · ${LOT[g.unit]}`,headRight:`<span class="mono" style="font-size:20px">${money(o.local,cur.sym)}</span>`,rebuild:null,
      body:`<dl class="kv"><dt>Buy price</dt><dd>${usd(bp)}</dd><dt>Sell price</dt><dd>${usd(sp)}</dd>${rb>0?`<dt>Standing bonus</dt><dd class="up">+${Math.round(rb*100)}% · ${repTier(S.loc)}</dd>`:''}<dt>In hold</dt><dd>${qfmt(h)}${c&&c.q?` · avg ${usd(c.cost/c.q)}`:''}</dd><dt>Station stock</dt><dd>${o.stock?qfmt(o.stock):o.sells?'sold out today':'buys only'}</dd><dt>Can buy</dt><dd>${maxBuy}${!o.stock&&o.sells?' · new stock on your next visit':''}${reserve&&safeBuy<maxBuy?` · ${safeBuy} if you keep ${usd(reserve)} for fuel to ${short(ST(sel).name)}`:''}</dd><dt>Mass per lot</dt><dd>${g.kg>=1000?'1 t':g.kg+' kg'}</dd></dl>
        ${g.restricted?'<p class="small" style="color:#c9b9a8">Export controlled: non-dollar stations may inspect it.</p>':''}${g.perish?'<p class="small" style="color:#c9b9a8">Perishable: loses 3% per travel day.</p>':''}
        <div class="trade-row"><input type="range" id="qty-r" min="0" max="${mx}" value="${q0}" aria-label="Quantity"><input type="number" id="qty" min="0" max="${mx}" value="${q0}" aria-label="Quantity"></div><p class="small mono" id="qty-note"></p>
        <div class="grid2"><button class="btn ghost" type="button" id="b-max" ${(safeBuy||maxBuy)<1?'disabled':''}>Max (${safeBuy||maxBuy})</button><button class="btn ghost" type="button" id="b-all" ${h<=0?'disabled':''}>All (${qfmt(h)})</button></div>`,
      actions:[{label:'Buy',fn:()=>buy(selGood,qv())},{label:'Sell',kind:'warnb',fn:()=>sell(selGood,qv())}],
      wire:()=>{const upd=()=>{const n=qv(),bb=document.querySelectorAll('#sh-acts button');bb[0].disabled=n<1||n>maxBuy;bb[1].disabled=n<1||n>sellMax;
          const pl=c&&c.q&&n<=h?` · sale P/L ${(sp-c.cost/c.q)*n>=0?'+':'−'}${usd(Math.abs((sp-c.cost/c.q)*n))}`:'';const xf=sel&&sel!==S.loc&&!isInterstellar(S.loc,sel)&&n>0?(()=>{const f=1-Math.exp(-dv(S.loc,sel)/veP());return n*perT*f/(1-f);})():0;$('#qty-note').textContent=`${n} × ${usd(bp)} = ${usd(n*bp)} · +${tons(n*perT)}${pl}${xf>=.05?` · needs +${tons(xf)} fuel for ${short(ST(sel).name)}`:''}`;};
        $('#qty-r').addEventListener('input',e=>{$('#qty').value=e.target.value;upd();});$('#qty').addEventListener('input',e=>{$('#qty-r').value=e.target.value;upd();});
        $('#b-max').addEventListener('click',()=>buy(selGood,safeBuy||maxBuy));$('#b-all').addEventListener('click',()=>sell(selGood,h));upd();}};};
  openSheet(build());
}
const qv=()=>Math.max(0,Math.floor(+($('#qty')||{}).value||0));
function mapSVG(){
  const R=236,ringR=lg=>R*Math.pow((lg-3.6)/(14.2-3.6),.7);
  const polar=s=>{const km=s.sys==='star'?ly(s.id,'leo')*9.461e12:s.km;const t=Math.max(0,(Math.log10(km)-3.6)/(14.2-3.6));const r=R*Math.pow(t,.7);const a=(s.ang-90)*Math.PI/180;return [320+r*Math.cos(a),320+r*Math.sin(a),s.ang];};
  const rings=[[4,'10,000 km'],[6,'1 million km'],[Math.log10(1.496e8),'1 AU'],[Math.log10(9.461e12),'1 ly'],[Math.log10(9.461e13),'10 ly']];
  let svg=rings.map(([lg,l],i)=>{const r=ringR(lg);return `<circle class="ring ${i>=3?'ly':''}" cx="320" cy="320" r="${r.toFixed(1)}"/><text class="ringlbl" x="324" y="${(320+r+12).toFixed(1)}">${l}</text>`;}).join('');
  svg+=`<circle class="earth" cx="320" cy="320" r="5"/><text class="ringlbl" x="328" y="314">Earth</text>`;
  const [hx,hy]=polar(ST(S.loc));if(sel){const [sx,sy]=polar(ST(sel));svg+=`<line class="route" x1="${hx}" y1="${hy}" x2="${sx}" y2="${sy}"/>`;}
  svg+=STATIONS.map(s=>{const [x,y,ang]=polar(s),isHere=s.id===S.loc,p=isHere?null:plan(s.id),right=Math.cos((ang-90)*Math.PI/180)>=-.15;
    return `<g class="node${s.sys==='star'?' star':''}${isHere?' here':''}${p&&!p.ok?' dim':''}" data-id="${s.id}" tabindex="${isHere?-1:0}" role="button" aria-label="${s.name}">${isHere?`<circle class="halo" cx="${x}" cy="${y}" r="11"/>`:''}<circle class="dot" cx="${x}" cy="${y}" r="${isHere?6:5.5}"/><circle cx="${x}" cy="${y}" r="18" fill="transparent"/><text x="${right?x+11:x-11}" y="${y+4}" text-anchor="${right?'start':'end'}">${short(s.name)}</text></g>`;}).join('');
  return `<div class="chart"><svg viewBox="0 0 640 640" role="group" aria-label="Log-scale chart, distance from Earth">${svg}</svg></div>`;
}
function openMove(){
  const build=()=>{
    const stop=s=>{const isHere=s.id===S.loc,p=isHere?null:plan(s.id);const svc=svcList(s).map(x=>SVC[x]).join(' · ');
      const cost=isHere?'you are here':p.inter?`${p.days}d · ${(p.he3*.1).toFixed(2)} kg He-3`:`${p.days}d · ${tons(p.burn)}`;
      return `<li><button class="stop${s.sys==='star'?' star':''}${isHere?' here':''}${p&&!p.ok?' off':''}" type="button" data-id="${s.id}" ${isHere?'disabled':''}><i></i><span class="nm"><b>${short(s.name)}</b><span>${svc||(s.sys==='star'?s.place.split(' · ')[1]:'')}</span></span><span class="cost">${cost}${p&&p.inter?'':p?`<br>Δv ${p.dv.toFixed(1)}`:''}</span></button></li>`;};
    const strand=!S.over&&!canMoveSomewhere()?`<p class="small warn" style="margin-bottom:8px">Stranded: no destination is reachable with fuel you can pay for. Open any stop to call the STA emergency tanker.</p>`:'';
    const list=strand+`<ul class="line"><h4>Solar System · cost is Δv</h4>${STATIONS.filter(s=>s.sys==='sol').map(stop).join('')}<h4>Interstellar · cost is time and He-3</h4>${STATIONS.filter(s=>s.sys==='star').map(stop).join('')}</ul>`;
    return {title:'Move',eyebrow:`Day ${S.day} of ${S.total} · wet mass ${tons(DRY+massT())}`,rebuild:null,
      headRight:`<div class="toggle" role="group" aria-label="View"><button type="button" data-v="list" aria-pressed="${ui.moveView==='list'}">List</button><button type="button" data-v="chart" aria-pressed="${ui.moveView==='chart'}">Chart</button></div>`,
      body:ui.moveView==='list'?list:mapSVG()+'<p class="small" style="color:#c9b9a8">Log scale from Earth. Tap a station.</p>',
      wire:sh=>{sh.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{ui.moveView=b.dataset.v;openSheet(build());}));
        sh.querySelectorAll('.stop:not([disabled])').forEach(b=>b.addEventListener('click',()=>openRoute(b.dataset.id)));
        sh.querySelectorAll('.node').forEach(n=>{const f=()=>{if(n.dataset.id!==S.loc)openRoute(n.dataset.id);};n.addEventListener('click',f);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});});}};};
  openSheet(build());
}
function openRoute(dest){
  sel=dest;
  const build=()=>{const d=ST(dest),p=plan(dest),m=S.mkt.data,rDay=Math.max(1,S.day-p.lag),rep=market(S.seed,rDay,dest);
    const rows=GOODS.map(g=>{const there=rep[g.id],here=m[g.id],h=held(g.id);if(!there||(!h&&!(here&&here.stock)))return '';
      const st=sellAt(dest,there.local,rDay,g.id),bh=here&&here.stock?buyAt(S.loc,here.local):null,basis=h?S.cargo[g.id].cost/h:null,ref=h?basis:bh,mg=ref?(st-ref)/ref:null;
      return `<tr><td>${g.name}${h?`<span class="sub">${qfmt(h)} held · paid ${usd(basis)}</span>`:''}</td><td class="n">${bh?usd(bh):'–'}</td><td class="n">${usd(st)}</td><td class="n ${mg>0?'up':'dn'}">${mg===null?'–':(mg>=0?'+':'−')+Math.abs(Math.round(mg*100))+'%'}</td></tr>`;}).join('');
    const fq=fuelQuote(dest),acts=[];
    if(fq){if(fq.cost<=S.cash)acts.push({label:`Load ${fq.label} · ${usd(fq.cost)}`,kind:'ghost',fn:()=>loadFuel(dest)});
      else if(S.debt+fq.cost*creditMult()<=CREDIT_LIMIT)acts.push({label:`Fuel on credit · +${usd(fq.cost*creditMult())}`,kind:'ghost',fn:()=>loadFuel(dest,true)});}
    acts.push({label:'Jump',fn:jump,disabled:!p.ok||S.over});
    const charterHere=S.charter&&S.charter.to===dest;
    return {title:d.name,eyebrow:d.place,rebuild:()=>build(),
      headRight:`<button class="linkbtn" type="button" id="r-back" style="color:#c9b9a8">‹ All stops</button>`,
      body:`<dl class="kv"><dt>Travel</dt><dd>${p.days} ${p.days>1?'days':'day'}${p.inter?` · ${ly(S.loc,dest).toFixed(2)} ly`:''}</dd>
        ${p.inter?`<dt>Fusion fuel</dt><dd>${(p.he3*.1).toFixed(2)} kg · ${(held('he3')*.1).toFixed(2)} aboard</dd>`:`<dt>Δv</dt><dd>${p.dv.toFixed(2)} km/s</dd><dt>Propellant burn</dt><dd>${tons(p.burn)} of ${tons(held('prop'))}</dd>${p.loadProp>0?`<dt>Fuel to load</dt><dd class="warn">${tons(p.loadProp)} <span class="sub" style="display:inline">(fuel adds mass)</span></dd>`:''}<dt>Wet mass</dt><dd>${tons(DRY+massT())}</dd>`}
        <dt>Interest in transit</dt><dd>${usd(p.interest)}</dd><dt>Price report</dt><dd>${p.lag?`${p.lag}d old · light-lag`:'live'}</dd><dt>Currency</dt><dd>${CUR[d.bloc].sym} ${CUR[d.bloc].name}</dd>${charterHere?`<dt>Contract balance</dt><dd class="up">+${usd(S.charter.pay*.6)}</dd>`:''}</dl>
        ${p.ok?'':`<p class="small warn">Cannot jump: ${p.reasons.join('; ')}.</p>`}${flashMsg?`<p class="small warn">${flashMsg}</p>`:''}
        ${p.ok?'':routeHelp(dest,p,fq)}
        ${rows?`<table><thead><tr><th>Cargo</th><th class="n">Here</th><th class="n">There</th><th class="n">Margin</th></tr></thead><tbody>${rows}</tbody></table><p class="small" style="color:#c9b9a8">Per lot in dollars after spreads, before fuel. Margin compares there with here, or with what you paid for cargo you hold. Prices are today's; they drift a little by arrival. Trades shows profit after fuel.</p>`:''}`,
      actions:acts,wire:sh=>{$('#r-back').addEventListener('click',()=>{flashMsg='';openMove();});sh.querySelectorAll('[data-via]').forEach(b=>b.addEventListener('click',()=>openRoute(b.dataset.via)));const j=sh.querySelector('#r-jettison');if(j)j.addEventListener('click',()=>{jettisonFor(plan(dest).loadProp);openRoute(dest);});const t=sh.querySelector('#r-sta');if(t)t.addEventListener('click',emergencyFuel);}};};
  flashMsg='';openSheet(build());
}

/* ---------- codex ---------- */
function codexHTML(){
  const nm=ids=>ids.map(i=>G(i).name).join(', ')||'–';
  const anchor={water:'Early market $500/kg lunar surface, $1,000/kg EML1 (Sowers); launch parity $3,246/kg Falcon 9, $10–100/kg Starship target',prop:'Same anchors as water: electrolysis makes LOX/LH2 from ice',metal:'Game assumption: local ISRU cheap, launch-cost parity in orbit',nitro:'Scarce on the Moon; ammonium salts on Ceres. Game assumption',food:'Game assumption: launch cost plus handling',elec:'Game assumption: Earth-made, priced up with distance',leu:'Game assumption; NASA lunar reactor uses low-enriched uranium',pgm:'Platinum $2,153.50/oz on 5 Mar 2026, about $69,000/kg',he3:'$2,500–3,000 per liter; Interlune $20M/kg',samp:'Game assumption: scientific value of extrasolar material'};
  const sol=STATIONS.filter(s=>s.sys==='sol');
  return `<div class="codex" style="display:grid;gap:18px">
  <div><h3>Story</h3><div style="display:grid;gap:8px">${STORY}</div><p class="small" style="margin-top:8px"><button class="linkbtn" type="button" onclick="showIntro(true)">Replay the boot log</button></p></div>
  <div><h3>Standing and acts</h3><ul>
    <li><b>Colony standing</b> runs 0–100 per station: Unknown, Known (20), Trusted (50), Partner (80). Selling a colony goods it wants earns up to 10 a sale and 16 a day; supply contracts earn 8, colony requests 15, a paid inspection 5. Refusing an inspector costs 8.</li>
    <li><b>Bonuses</b> apply to the goods a colony wants: Known +1%, Trusted +3% and half the inspections, Partner +5%, supply contracts +15% and no inspections.</li>
    <li><b>Acts</b> are six milestones per mission. Clearing the debt (Solvent) lowers the fuel credit fee from 10% to 5%.</li></ul></div>
  <div><h3>Who runs space</h3><ul class="orgs"><li><b>Solar Transit Authority (STA)</b><span>Treaty body: traffic control, debris warnings, probe licensing, the common clock</span><span class="sub">Real-world root: UN Outer Space Treaty (1967); Coordinated Lunar Time</span></li><li><b>Halyard Consortium</b><span>Dollar-bloc agency. Built you and holds your commissioning debt. Runs LEO, Artemis, Psyche and Proxima</span><span class="sub">Real-world root: NASA and the Artemis Accords partners (2020 onward)</span></li><li><b>European Deep Space Directorate (EDSD)</b><span>Euro-bloc agency. Runs Gateway, Ceres and Tau Ceti; enforces export control</span><span class="sub">Real-world root: ESA</span></li><li><b>Guanghan Administration</b><span>Yuan-bloc agency. Runs the ILRS station, Utopia and Barnard's Star; enforces export control</span><span class="sub">Real-world root: CNSA and the ILRS program. Named for Guang Han Gong, the Chang'e-3 landing site (IAU-approved, 2016)</span></li><li><b>Tallis Freight</b><span>Corporation operating KESTREL, which dumps cargo to undercut you</span><span class="sub">Real-world root: Commercial launch and logistics companies</span></li><li><b>Colony Councils</b><span>Local government at each station. Your colony standing is your record with them</span><span class="sub">Real-world root: Proposals for off-world settlement governance</span></li><li><b>Lagan Crews</b><span>Unlicensed salvagers (future update)</span><span class="sub">Real-world root: Maritime salvage law: lagan is cargo sunk but marked with a buoy so its owner can recover it</span></li><li><b>Chartered Lineage</b><span>A player's line of forks registered as its own agency (planned for the Lineage tier)</span></li></ul></div>
  <div><h3>Station services</h3><ul class="orgs">
    <li><b>Banks</b><span>Halyard Bank at LEO lends dollars at 0.60% a day, EDSD Credit at Gateway lends euros at 0.50%, and Guanghan Bank at ILRS lends yuan at 0.45%. Each line starts at $20–30M and grows $0.7M per standing point at the bank's station. A 1% fee is added to each loan. Euro and yuan loans are owed in that currency, so exchange rates change what you owe in dollars. Repay at any in-system stop of the same bloc. Loans count against your fund.</span><span class="sub">Real-world root: foreign-currency borrowing, where exchange-rate moves change the real cost of a loan</span></li>
    <li><b>STA Treasury</b><span>Deposits at any Solar System stop earn 0.20% a day and count toward your fund. If the probe is lost, the Treasury releases the balance to your fork. Light-lag blocks access from the stars. The rate is below every loan, so borrowing to save loses money.</span><span class="sub">Real-world root: US Treasury bills, short-term government debt</span></li>
    <li><b>Fork foundry</b><span>At Psyche Works, $25M, 10 t of structural metals and 10 kg of platinum-group metals boot a fork without ending your mission. It shuttles a route you assign and remits income every day: about $1.3M times a route factor (0.7 + 0.07 per km/s of Δv), minus $0.2M upkeep, with a daily incident risk of 2% plus 0.4% per km/s. Up to 3 per mission; decommissioning returns 20% of the cash cost.</span><span class="sub">Real-world root: NASA's Psyche probe, launched October 13, 2023, is due to orbit the metal-rich asteroid 16 Psyche in August 2029. Self-reproducing probes: Freitas (1980)</span></li>
    <li><b>Fork traits</b><span>Each fork boots with one trait, chosen at random: Hauler (+20% income), Careful (60% fewer incidents, −5% income), Gambler (wide swings, +5% on average), Diplomat (+1 standing a day at both route stops), Frugal (half the upkeep) or Restless (+10% income, drifts more). Every 7 days a fork has a 5% chance of drifting to a new trait (25% if Restless).</span><span class="sub">Copies diverge: the same idea as Egan's <i>Diaspora</i>, listed under Further reading</span></li>
    <li><b>Bonded warehouse</b><span>At Ceres: store cargo for $15,000 per tonne per day, paid when you withdraw. Food does not spoil there, and inspectors cannot board cargo you are not carrying.</span><span class="sub">Real-world root: bonded warehouses, where imported goods wait without paying duty until they are withdrawn</span></li>
    <li><b>Hull and cargo insurance</b><span>At Gateway: a 10-day policy for $2.5M plus 1% of your cargo's cost. It pays $150,000 per hull point lost to debris, storms or faults, and the cost of electronics ruined by storms.</span><span class="sub">Real-world root: Lloyd's of London, which began around 1689 in Edward Lloyd's coffee house as a place to buy marine insurance</span></li>
    <li><b>Engine yard</b><span>At Utopia: engine tunes raise exhaust velocity from 9.0 to 9.9 km/s ($10M) and 10.8 km/s ($25M), roughly 10% and 20% better, and hull plating ($15M) cuts damage by 40%. Shippers still price supply contracts on the standard engine, so a tuned engine keeps the difference.</span><span class="sub">Real-world root: Utopia Planitia, where China's Zhurong rover landed on May 14, 2021. Tune figures are game assumptions; studies of advanced nuclear-thermal engines target specific impulse near 1,000 s (about 9.8 km/s)</span></li></ul></div>
  <div><h3>Physics</h3><ul>
    <li><b>Time.</b> Real distances scale so the longest leg (Barnard's Star to Tau Ceti, 15.5 ly) takes 7 days: Proxima 2, Barnard's Star 3, Tau Ceti 6. Solar System legs round up to 1 day.</li>
    <li><b>In-system cost is delta-v.</b> Burned = wet mass × (1 − e<sup>−Δv/v<sub>e</sub></sup>), with a nuclear-thermal v<sub>e</sub> of 9 km/s and a 30 t dry mass. Every tonne aboard costs fuel.</li>
    <li><b>Interstellar legs</b> burn 0.15 kg of helium-3 per day in a fusion drive. The drive and your uploaded mind are the game's two pieces of fiction; everything else is sourced or marked as an assumption.</li>
    <li><b>Refuelling.</b> Every Solar System station keeps a propellant reserve for ships, and every star colony and the ILRS He-3 plant keeps a He-3 reserve, so refuelling never sells out. Fuel comes from the day's stock first; anything beyond it comes from the reserve at a 25% premium. Your hold still limits how much you can carry. If you cannot pay for fuel anywhere, the STA sends an emergency tanker at a 50% surcharge, added to your debt.</li>
    <li><b>Light-lag.</b> Price reports from another star are as old as the light that carried them, on the same scale.</li>
    <li><b>The commissioning debt</b> is owed to Halyard, which takes repayment only at its own stops (LEO, Artemis, Psyche). Clearing it is the Solvent act.</li>
    <li><b>Interest</b> accrues on the common-frame clock (Krugman's First Theorem of Interstellar Trade): ${(DEBT_RATE*100).toFixed(2)}% per day.</li>
    <li><b>Lunar clocks</b> run about 58.7 µs per day fast; NASA owes an LTC strategy by the end of 2026.</li></ul></div>
  <div><h3>Money</h3><ul>
    <li><b>Dollar bloc</b> (LEO, Artemis, Psyche, Proxima): payment stablecoin under the GENIUS Act (Public Law 119-27, July 18, 2025).</li>
    <li><b>Euro bloc</b> (Gateway, Ceres, Tau Ceti): digital euro, which the ECB says could launch in 2029.</li>
    <li><b>China bloc</b> (ILRS, Utopia, Barnard's Star): e-CNY, in a live pilot in 26 cities.</li>
    <li>Prices are local; your account is in dollars. Spread 0.5% in-system, 3% at stars for light-lag settlement risk. Starting rates from the ECB: €1 = $1.1193; $1 = ¥6.686.</li>
    <li><b>Best trades</b> shows each trade's own profit after spreads, exchange rates and the extra fuel its mass adds. Trip fuel, for the probe and cargo already aboard, is listed separately because you pay it once per trip.</li>
    <li><b>Supply contracts</b> pay on local fuel cost plus a fee, 40% up front. Fuel already aboard is reimbursed at what you paid for it. Undelivered contracts lapse after 5 days and the advance becomes debt. <b>Fuel credit</b> costs 10% (5% after the Solvent act) and stops at $150M of commissioning debt.</li>
    <li><b>Markets:</b> which goods a stop trades is fixed for the mission. Prices follow trends that turn every few days, with a little daily noise, so today's price is a good guide to tomorrow's but not to next week's. Shortages and KESTREL dumps still hit without warning.</li>
    <li><b>Prices are landed costs.</b> A stop's price is what the good costs where it is made, plus the propellant to ship it there (each kilogram of cargo needs e<sup>Δv/v<sub>e</sub></sup> − 1 kilograms of fuel), times local scarcity: stops that make a good sell at 85–105% of cost, neutral stops 100–120%, stops that need it 115–145%. Interstellar goods carry a time premium of 1.3 plus 0.1 per travel day. So most trades earn 15–60% after fuel, and shortages are where fortunes are made.</li>
    <li><b>Price era:</b> a mature ISRU economy. LEO water and propellant land at about $500–750/kg, below Sowers's early-market estimate of $1,000/kg at EML1.</li></ul></div>

/* ---------- boot ---------- */
function start(data){
  const saved=(data&&data.state)||loadSaved();
  if(saved)S=norm(saved);
  if(data&&data.ui)Object.assign(ui,data.ui,{sheet:null});
  if(ui.screen!=='home'&&!S)ui.screen='home';
  render();
  if(S&&S.event&&ui.screen==='market')showEvent();
}
window.claude?.hot?.snapshot?.(()=>({state:S,ui:{screen:ui.screen,page:ui.page,moveView:ui.moveView,runLen:ui.runLen}}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
